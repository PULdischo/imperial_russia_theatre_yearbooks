<text x="1304.5" y="618" font-size="14" font-weight="700" fill="#b5562f">Moscow · 1904/05 · p. 145</text>
<text x="1304.5" y="644" font-size="15" fill="#1f2328">«Балетъ въ 4 д.,</text>
<text x="1304.5" y="665" font-size="15" fill="#1f2328"><tspan font-weight="700">соч. М. Петипа</tspan>, музыка</text>
<text x="1304.5" y="686" font-size="15" fill="#1f2328">А. Корещенко.»</text>
<text x="1304.5" y="713" font-size="14" font-style="italic" fill="#5b6470">Petipa alone credited;</text>
<text x="1304.5" y="732" font-size="14" font-style="italic" fill="#5b6470">first date 13 Feb 1905</text>
