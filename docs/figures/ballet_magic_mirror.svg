<text x="80" y="84" font-size="40" font-weight="700" fill="#1f2328">One work, two cities in turn: «Волшебное зеркало»</text>
<text x="80" y="120" font-size="20" fill="#5b6470">A St Petersburg premiere that survives there only in excerpts, while Moscow keeps the whole ballet</text>
