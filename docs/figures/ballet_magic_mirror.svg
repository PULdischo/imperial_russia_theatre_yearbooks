<text x="100" y="489" font-size="15" font-weight="400" fill="#1f2328">4-е д. бал. Волшебное зеркало <tspan fill="#8a929c">×3</tspan></text>
<text x="100" y="512" font-size="15" font-weight="400" fill="#1f2328">1-е д., 3-е д. и 2-я карт. 4-го д. бал. Волшебное зеркало <tspan fill="#8a929c">×1</tspan></text>
