<text x="574.0" y="644" font-size="15" fill="#1f2328">«Фантастическій балетъ</text>
<text x="574.0" y="665" font-size="15" fill="#1f2328">въ 4 д. и <tspan font-weight="700">7 карт.</tspan> …</text>
<text x="574.0" y="686" font-size="15" fill="#1f2328">либретто составлено</text>
<text x="574.0" y="707" font-size="15" fill="#1f2328">М. И. Петипа и Г***</text>
<text x="574.0" y="728" font-size="15" fill="#1f2328">музыка А. Н. Корещенко.»</text>
<text x="574.0" y="755" font-size="14" font-style="italic" fill="#5b6470">entry marked * in the list;</text>
<text x="574.0" y="774" font-size="14" font-style="italic" fill="#5b6470">one date, 9 Feb 1903</text>
