<text x="1061.0" y="644" font-size="15" fill="#1f2328"><tspan font-weight="700">«(1-е, 3-е д. и 2-я карт.</tspan></text>
<text x="1061.0" y="665" font-size="15" fill="#1f2328"><tspan font-weight="700">4-го д.).</tspan> Большой</text>
<text x="1061.0" y="686" font-size="15" fill="#1f2328">фантастическій балетъ …»</text>
<text x="1061.0" y="713" font-size="14" font-style="italic" fill="#5b6470">selected acts only, one date;</text>
<text x="1061.0" y="732" font-size="14" font-style="italic" fill="#5b6470">still filed under the work</text>
