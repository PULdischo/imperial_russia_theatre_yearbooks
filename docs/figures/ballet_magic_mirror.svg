<text x="817.5" y="618" font-size="14" font-weight="700" fill="#2f6db5">St Petersburg · 1903/04 · p. 45</text>
<text x="817.5" y="644" font-size="15" fill="#1f2328">«Большой фантастическій</text>
<text x="817.5" y="665" font-size="15" fill="#1f2328">балетъ въ 4 д. и <tspan font-weight="700">8 карт.</tspan>,</text>
<text x="817.5" y="686" font-size="15" fill="#1f2328">… либретто М. И. Петипа</text>
<text x="817.5" y="707" font-size="15" fill="#1f2328">и Г***, …»</text>
<text x="817.5" y="734" font-size="14" font-style="italic" fill="#5b6470">one more scene than</text>
<text x="817.5" y="753" font-size="14" font-style="italic" fill="#5b6470">the year before</text>
