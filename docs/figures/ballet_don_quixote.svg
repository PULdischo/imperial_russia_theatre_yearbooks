<text x="80" y="84" font-size="40" font-weight="700" fill="#1f2328">One work, many iterations: «Донъ-Кихотъ»</text>
<text x="80" y="120" font-size="20" fill="#5b6470">A complex case: a gap, a new title, a new staging taken up by St Petersburg, and changing credits, all under one work</text>
